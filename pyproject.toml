[tool.poetry]
name = "goit-pythonweb-hw-10"
version = "1.0.0"
description = ""
authors = ["Oleh"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = "^0.30.0"

sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"

python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "4.0.1"

python-multipart = "^0.0.9"

fastapi-mail = "^1.4.1"

itsdangerous = "^2.2.0"

slowapi = "^0.1.9"

cloudinary = "^1.40.0"

python-dotenv = "^1.0.1"

email-validator = "^2.2.0"
sphinx = "^9.1.0"
redis = {extras = ["asyncio"], version = "^7.4.0"}
alembic = "^1.18.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "sphinx (>=9.1.0,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "tests/*"
]
